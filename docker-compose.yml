services:
  postgres:
    image: postgres:16-alpine
    container_name: alti-team-db
    environment:
      POSTGRES_USER: alti_team
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: alti_team
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alti_team -d alti_team']
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: alti-team-livekit
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}${LIVEKIT_API_SECRET:-secret}
    volumes:
      - ./livekit-config.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

  livekit-egress:
    image: livekit/egress:latest
    container_name: alti-team-livekit-egress
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_WS_URL=ws://livekit:7880
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
    volumes:
      - ./egress-config.yaml:/etc/egress.yaml
    command: --config /etc/egress.yaml
    depends_on:
      - livekit


  adminer:
    image: adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: alti-team-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
